repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest
          - polars
          - pandas
          - numpy
          - sqlalchemy
          - pydantic
          - pyyaml
          - ccxt
          - redis
          - fastapi
          - uvicorn
          - streamlit
          - plotly
          - torch
          - scikit-learn
          - xgboost
          - joblib
          - tenacity
          - httpx
          - websockets
          - python-telegram-bot
          - optuna
        exclude: "tests/test_api.py"
